<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 900" width="1000" height="900" font-family="Segoe UI, Microsoft YaHei, PingFang SC, Noto Sans SC, Helvetica Neue, Arial, sans-serif">
  <rect width="1000" height="900" fill="#ffffff"/>
  <defs>
    <marker id="ablue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker>
    <marker id="agreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/></marker>
    <marker id="aorange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ea580c"/></marker>
    <marker id="apurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/></marker>
    <marker id="agray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/></marker>
  </defs>
  <text x="32" y="40" font-size="19" font-weight="600" fill="#111827">一次对话的完整链路（含工具循环）</text>
  <rect x="170.0" y="66" width="240" height="38" rx="8" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>
  <text x="290.0" y="88" text-anchor="middle" font-size="14" font-weight="600" fill="#6b7280">START</text>
  <rect x="170.0" y="134" width="240" height="74" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="290.0" y="156" text-anchor="middle" font-size="14" font-weight="600" fill="#2563eb">load_context</text>
  <text x="290.0" y="176" text-anchor="middle" font-size="12" fill="#4b5563">查 NPC / 玩家 / 好感度</text>
  <text x="290.0" y="194" text-anchor="middle" font-size="12" fill="#4b5563">拼 system_prompt</text>
  <rect x="170.0" y="238" width="240" height="74" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="290.0" y="260" text-anchor="middle" font-size="14" font-weight="600" fill="#059669">retrieve_memory</text>
  <text x="290.0" y="280" text-anchor="middle" font-size="12" fill="#4b5563">Redis 取最近 5 轮</text>
  <text x="290.0" y="298" text-anchor="middle" font-size="12" fill="#4b5563">pgvector 三因子召回 Top-5</text>
  <rect x="170.0" y="342" width="240" height="74" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="290.0" y="364" text-anchor="middle" font-size="14" font-weight="600" fill="#7c3aed">agent_step ★</text>
  <text x="290.0" y="384" text-anchor="middle" font-size="12" fill="#4b5563">绑工具调一次 LLM</text>
  <text x="290.0" y="402" text-anchor="middle" font-size="12" fill="#4b5563">要么回答，要么要求调工具</text>
  <rect x="170.0" y="446" width="240" height="74" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="290.0" y="468" text-anchor="middle" font-size="14" font-weight="600" fill="#2563eb">analyze_turn</text>
  <text x="290.0" y="488" text-anchor="middle" font-size="12" fill="#4b5563">一次结构化输出</text>
  <text x="290.0" y="506" text-anchor="middle" font-size="12" fill="#4b5563">delta / importance / facts</text>
  <rect x="170.0" y="550" width="240" height="56" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="290.0" y="572" text-anchor="middle" font-size="14" font-weight="600" fill="#2563eb">apply_affinity</text>
  <text x="290.0" y="592" text-anchor="middle" font-size="12" fill="#4b5563">算新分数与新等级</text>
  <rect x="170.0" y="636" width="240" height="74" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="290.0" y="658" text-anchor="middle" font-size="14" font-weight="600" fill="#059669">write_memory</text>
  <text x="290.0" y="678" text-anchor="middle" font-size="12" fill="#4b5563">写 Redis 工作记忆</text>
  <text x="290.0" y="696" text-anchor="middle" font-size="12" fill="#4b5563">写 pgvector 长期记忆</text>
  <rect x="170.0" y="740" width="240" height="56" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="290.0" y="762" text-anchor="middle" font-size="14" font-weight="600" fill="#ea580c">persist</text>
  <text x="290.0" y="782" text-anchor="middle" font-size="12" fill="#4b5563">全图唯一 commit 点</text>
  <rect x="170.0" y="826" width="240" height="38" rx="8" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>
  <text x="290.0" y="848" text-anchor="middle" font-size="14" font-weight="600" fill="#6b7280">END</text>
  <line x1="290" y1="104" x2="290" y2="130" stroke="#2563eb" stroke-width="1.8" marker-end="url(#ablue)"/>
  <line x1="290" y1="208" x2="290" y2="234" stroke="#2563eb" stroke-width="1.8" marker-end="url(#ablue)"/>
  <line x1="290" y1="312" x2="290" y2="338" stroke="#2563eb" stroke-width="1.8" marker-end="url(#ablue)"/>
  <line x1="290" y1="416" x2="290" y2="442" stroke="#2563eb" stroke-width="1.8" marker-end="url(#ablue)"/>
  <line x1="290" y1="520" x2="290" y2="546" stroke="#2563eb" stroke-width="1.8" marker-end="url(#ablue)"/>
  <line x1="290" y1="606" x2="290" y2="632" stroke="#2563eb" stroke-width="1.8" marker-end="url(#ablue)"/>
  <line x1="290" y1="710" x2="290" y2="736" stroke="#2563eb" stroke-width="1.8" marker-end="url(#ablue)"/>
  <line x1="290" y1="796" x2="290" y2="822" stroke="#2563eb" stroke-width="1.8" marker-end="url(#ablue)"/>
  <rect x="580" y="332" width="210" height="74" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="685.0" y="354" text-anchor="middle" font-size="14" font-weight="600" fill="#7c3aed">tool_node ★</text>
  <text x="685.0" y="374" text-anchor="middle" font-size="12" fill="#4b5563">执行工具 / 异常当观察结果</text>
  <text x="685.0" y="392" text-anchor="middle" font-size="12" fill="#4b5563">结果写回 tool_trace</text>
  <line x1="410.0" y1="361.0" x2="576" y2="361.0" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#apurple)"/>
  <text x="506.0" y="353.0" text-anchor="middle" font-size="11" fill="#7c3aed">有 tool_calls</text>
  <line x1="576" y1="405.0" x2="414.0" y2="405.0" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#apurple)"/>
  <text x="506.0" y="423.0" text-anchor="middle" font-size="11" fill="#7c3aed">执行完回来再判断</text>
  <line x1="410.0" y1="576" x2="500" y2="576" stroke="#ea580c" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#aorange)"/>
  <text x="455" y="566" text-anchor="middle" font-size="11" fill="#ea580c">等级变化</text>
  <rect x="500" y="540" width="250" height="92" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="625.0" y="562" text-anchor="middle" font-size="14" font-weight="600" fill="#ea580c">emit_level_up（条件边）</text>
  <text x="625.0" y="582" text-anchor="middle" font-size="12" fill="#4b5563">写 events 台账</text>
  <text x="625.0" y="600" text-anchor="middle" font-size="12" fill="#4b5563">产出 pending_broadcast</text>
  <text x="625.0" y="618" text-anchor="middle" font-size="12" fill="#4b5563">由路由在 commit 后推送</text>
  <text x="320" y="884" text-anchor="middle" font-size="12" fill="#4b5563">工具调用是「决策 + 回答合一」：不需要工具时不会多花一次 LLM 调用</text>
  <text x="700" y="76" font-size="12.5" font-weight="600" fill="#111827">图例</text>
  <line x1="700" y1="92" x2="726" y2="92" stroke="#2563eb" stroke-width="1.8"/>
  <text x="734" y="96" font-size="11.5" fill="#4b5563">主干</text>
  <line x1="700" y1="112" x2="726" y2="112" stroke="#7c3aed" stroke-width="1.8"/>
  <text x="734" y="116" font-size="11.5" fill="#4b5563">工具循环</text>
  <line x1="700" y1="132" x2="726" y2="132" stroke="#ea580c" stroke-width="1.8" stroke-dasharray="5,4"/>
  <text x="734" y="136" font-size="11.5" fill="#4b5563">条件边</text>
</svg>