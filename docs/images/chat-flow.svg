<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1180" viewBox="0 0 1100 1180" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af"/></marker></defs><rect width="1100" height="1180" fill="#ffffff"/><text x="32" y="38" font-size="19" font-weight="600" fill="#111827">一次对话的完整链路（并行检索 + 工具循环）</text><text x="32" y="60" font-size="12" fill="#6b7280">主干是 DAG；agent_step ⇄ tool_node 是刻意保留的环</text><rect x="490" y="88" width="120" height="34" rx="17" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/><text x="550" y="110" text-anchor="middle" font-size="13" font-weight="600" fill="#374151">START</text><rect x="430.0" y="150" width="240" height="74" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="550.0" y="172" text-anchor="middle" font-size="14" font-weight="600" fill="#2563eb">load_context</text><text x="550.0" y="192" text-anchor="middle" font-size="12" fill="#4b5563">查 NPC / 玩家 / 好感度</text><text x="550.0" y="210" text-anchor="middle" font-size="12" fill="#4b5563">拼 system_prompt</text><line x1="550" y1="122" x2="550" y2="148" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#a)"/><path d="M550,224 L550,242" stroke="#9ca3af" stroke-width="1.5" fill="none"/><path d="M270.0,242 L830.0,242" stroke="#9ca3af" stroke-width="1.5" fill="none"/><line x1="270.0" y1="242" x2="270.0" y2="260" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#a)"/><line x1="830.0" y1="242" x2="830.0" y2="260" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#a)"/><text x="276.0" y="236" text-anchor="start" font-size="11" fill="#6b7280">并行</text><rect x="150" y="262" width="240" height="74" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/><text x="270.0" y="284" text-anchor="middle" font-size="14" font-weight="600" fill="#059669">retrieve_memory</text><text x="270.0" y="304" text-anchor="middle" font-size="12" fill="#4b5563">Redis 取最近 5 轮</text><text x="270.0" y="322" text-anchor="middle" font-size="12" fill="#4b5563">pgvector 三因子召回 Top-5</text><rect x="710" y="262" width="240" height="74" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/><text x="830.0" y="284" text-anchor="middle" font-size="14" font-weight="600" fill="#059669">retrieve_docs</text><text x="830.0" y="304" text-anchor="middle" font-size="12" fill="#4b5563">BM25 + 向量 + RRF 融合</text><text x="830.0" y="322" text-anchor="middle" font-size="12" fill="#4b5563">内部知识库 Top-2</text><rect x="916" y="253" width="34" height="18" rx="9" fill="#059669"/><text x="933" y="266" text-anchor="middle" font-size="10" fill="#ffffff" font-weight="600">新</text><path d="M270.0,336 L270.0,372 L550,372 L550,398" fill="none" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#a)"/><path d="M830.0,336 L830.0,372 L550,372" fill="none" stroke="#9ca3af" stroke-width="1.5"/><text x="558" y="366" text-anchor="start" font-size="11" fill="#6b7280">两个都完成才继续（fan-in 屏障）</text><rect x="430.0" y="400" width="240" height="74" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/><text x="550.0" y="422" text-anchor="middle" font-size="14" font-weight="600" fill="#7c3aed">agent_step</text><text x="550.0" y="442" text-anchor="middle" font-size="12" fill="#4b5563">绑工具调一次 LLM</text><text x="550.0" y="460" text-anchor="middle" font-size="12" fill="#4b5563">要么回答，要么要求调工具</text><path d="M670.0,437 L830.0,437 L830.0,518" fill="none" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#a)"/><text x="680.0" y="432" text-anchor="start" font-size="11" fill="#6b7280">有 tool_calls</text><rect x="710" y="520" width="240" height="74" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/><text x="830.0" y="542" text-anchor="middle" font-size="14" font-weight="600" fill="#7c3aed">tool_node</text><text x="830.0" y="562" text-anchor="middle" font-size="12" fill="#4b5563">执行工具，异常当观察回填</text><text x="830.0" y="580" text-anchor="middle" font-size="12" fill="#4b5563">结果写进 tool_trace</text><path d="M710,557 L670,557 L670,420 L672.0,420" fill="none" stroke="#c4b5fd" stroke-width="1.5" marker-end="url(#a)"/><text x="664" y="502" text-anchor="end" font-size="11" fill="#8b5cf6">执行完回到 agent_step（环）</text><rect x="430.0" y="620" width="240" height="74" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="550.0" y="642" text-anchor="middle" font-size="14" font-weight="600" fill="#2563eb">analyze_turn</text><text x="550.0" y="662" text-anchor="middle" font-size="12" fill="#4b5563">一次结构化输出</text><text x="550.0" y="680" text-anchor="middle" font-size="12" fill="#4b5563">delta / importance / facts</text><rect x="430.0" y="716" width="240" height="58" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="550.0" y="738" text-anchor="middle" font-size="14" font-weight="600" fill="#2563eb">apply_affinity</text><text x="550.0" y="758" text-anchor="middle" font-size="12" fill="#4b5563">算新分数与新等级</text><rect x="430.0" y="800" width="240" height="58" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="550.0" y="822" text-anchor="middle" font-size="14" font-weight="600" fill="#2563eb">emit_level_up</text><text x="550.0" y="842" text-anchor="middle" font-size="12" fill="#4b5563">等级变化才走（条件边）</text><rect x="430.0" y="884" width="240" height="58" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="550.0" y="906" text-anchor="middle" font-size="14" font-weight="600" fill="#2563eb">write_memory</text><text x="550.0" y="926" text-anchor="middle" font-size="12" fill="#4b5563">Redis 工作记忆 + pgvector</text><line x1="550" y1="474" x2="550" y2="618" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#a)"/><text x="558" y="606" text-anchor="start" font-size="11" fill="#6b7280">无 tool_calls</text><line x1="550" y1="694" x2="550" y2="714" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#a)"/><line x1="550" y1="774" x2="550" y2="798" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#a)"/><line x1="550" y1="858" x2="550" y2="882" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#a)"/><rect x="430.0" y="986" width="240" height="58" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/><text x="550.0" y="1008" text-anchor="middle" font-size="14" font-weight="600" fill="#dc2626">persist</text><text x="550.0" y="1028" text-anchor="middle" font-size="12" fill="#4b5563">全图唯一 commit 点</text><line x1="550" y1="958" x2="550" y2="984" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#a)"/><rect x="490" y="1072" width="120" height="34" rx="17" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/><text x="550" y="1094" text-anchor="middle" font-size="13" font-weight="600" fill="#374151">END</text><line x1="550" y1="1044" x2="550" y2="1070" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#a)"/><text x="150" y="1132" text-anchor="start" font-size="12" fill="#059669">绿色：检索（并行两支）</text><text x="400" y="1132" text-anchor="start" font-size="12" fill="#7c3aed">紫色：工具循环（刻意的环）</text><text x="680" y="1132" text-anchor="start" font-size="12" fill="#dc2626">红色：唯一提交点</text></svg>