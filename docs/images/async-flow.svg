<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" width="980" height="620" font-family="Segoe UI, Microsoft YaHei, PingFang SC, Noto Sans SC, Helvetica Neue, Arial, sans-serif">
  <rect width="980" height="620" fill="#ffffff"/>
  <defs>
    <marker id="ablue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker>
    <marker id="agreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/></marker>
    <marker id="aorange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ea580c"/></marker>
    <marker id="apurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/></marker>
    <marker id="agray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/></marker>
  </defs>
  <text x="32" y="40" font-size="19" font-weight="600" fill="#111827">异步任务与实时推送</text>
  <rect x="40" y="80" width="200" height="92" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="140.0" y="102" text-anchor="middle" font-size="14" font-weight="600" fill="#7c3aed">ticker（每 60s）</text>
  <text x="140.0" y="122" text-anchor="middle" font-size="12" fill="#4b5563">SET NX 抢锁</text>
  <text x="140.0" y="140" text-anchor="middle" font-size="12" fill="#4b5563">XPENDING 背压</text>
  <text x="140.0" y="158" text-anchor="middle" font-size="12" fill="#4b5563">推进日计划 / 派闲聊</text>
  <line x1="240" y1="130" x2="296" y2="130" stroke="#ea580c" stroke-width="1.8" marker-end="url(#aorange)"/>
  <text x="268" y="116" text-anchor="middle" font-size="11" fill="#ea580c">XADD</text>
  <rect x="298" y="96" width="190" height="74" rx="8" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>
  <text x="393.0" y="118" text-anchor="middle" font-size="14" font-weight="600" fill="#111827">Redis Stream</text>
  <text x="393.0" y="138" text-anchor="middle" font-size="12" fill="#4b5563">aitown:events</text>
  <text x="393.0" y="156" text-anchor="middle" font-size="12" fill="#4b5563">消费组 aitown-workers</text>
  <line x1="488" y1="130" x2="544" y2="130" stroke="#ea580c" stroke-width="1.8" marker-end="url(#aorange)"/>
  <text x="492" y="118" text-anchor="middle" font-size="10.5" fill="#ea580c">XREAD</text>
  <rect x="546" y="88" width="200" height="74" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="646.0" y="110" text-anchor="middle" font-size="14" font-weight="600" fill="#059669">consumer</text>
  <text x="646.0" y="130" text-anchor="middle" font-size="12" fill="#4b5563">handle_npc_chat</text>
  <text x="646.0" y="148" text-anchor="middle" font-size="12" fill="#4b5563">调 LLM 让两个 NPC 聊</text>
  <line x1="646" y1="158" x2="646" y2="196" stroke="#2563eb" stroke-width="1.8" marker-end="url(#ablue)"/>
  <rect x="536" y="198" width="220" height="56" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="646.0" y="220" text-anchor="middle" font-size="14" font-weight="600" fill="#2563eb">commit（先落库）</text>
  <text x="646.0" y="240" text-anchor="middle" font-size="12" fill="#4b5563">events 表写入</text>
  <path d="M 756,226 L 856,226 L 856,284" fill="none" stroke="#059669" stroke-width="1.8" stroke-dasharray="5,3" marker-end="url(#agreen)"/>
  <rect x="766" y="288" width="180" height="56" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="856.0" y="310" text-anchor="middle" font-size="14" font-weight="600" fill="#059669">PUBLISH</text>
  <text x="856.0" y="330" text-anchor="middle" font-size="12" fill="#4b5563">按玩家分频道</text>
  <line x1="646" y1="252" x2="646" y2="286" stroke="#059669" stroke-width="1.8" marker-end="url(#agreen)"/>
  <rect x="536" y="288" width="220" height="56" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="646.0" y="310" text-anchor="middle" font-size="14" font-weight="600" fill="#ea580c">XACK（最后确认）</text>
  <text x="646.0" y="330" text-anchor="middle" font-size="12" fill="#4b5563">消息离开 pending</text>
  <line x1="856" y1="350" x2="856" y2="392" stroke="#6b7280" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#agray)"/>
  <rect x="726" y="394" width="230" height="56" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="841.0" y="416" text-anchor="middle" font-size="14" font-weight="600" fill="#2563eb">ws.py（api 进程）</text>
  <text x="841.0" y="436" text-anchor="middle" font-size="12" fill="#4b5563">SUBSCRIBE → send_text</text>
  <line x1="726" y1="420" x2="672" y2="420" stroke="#2563eb" stroke-width="1.8" marker-end="url(#ablue)"/>
  <rect x="482" y="394" width="190" height="56" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="577.0" y="416" text-anchor="middle" font-size="14" font-weight="600" fill="#2563eb">浏览器</text>
  <text x="577.0" y="436" text-anchor="middle" font-size="12" fill="#4b5563">EventFeed 面板</text>
  <rect x="40" y="288" width="470" height="110" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="275.0" y="310" text-anchor="middle" font-size="14" font-weight="600" fill="#111827">三条规矩</text>
  <text x="275.0" y="330" text-anchor="middle" font-size="12" fill="#4b5563">① 顺序：commit → publish → ACK</text>
  <text x="275.0" y="348" text-anchor="middle" font-size="12" fill="#4b5563">  先落库，推出去的一定查得到；后 ACK，消息还能重放</text>
  <text x="275.0" y="366" text-anchor="middle" font-size="12" fill="#4b5563">② 推送失败只 warning：前端还有轮询兜底（推拉结合）</text>
  <text x="275.0" y="384" text-anchor="middle" font-size="12" fill="#4b5563">③ 崩在 commit 之后、ACK 之前 → 重启重做（at-least-once）</text>
  <rect x="40" y="440" width="420" height="74" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="250.0" y="462" text-anchor="middle" font-size="14" font-weight="600" fill="#111827">为什么任务用 Stream、推送用 Pub/Sub</text>
  <text x="250.0" y="482" text-anchor="middle" font-size="12" fill="#4b5563">任务丢了 = 功能缺失 → 必须可靠（pending + ACK）</text>
  <text x="250.0" y="500" text-anchor="middle" font-size="12" fill="#4b5563">推送丢了 = 晚几秒看到 → 可丢，轮询能补</text>
  <text x="40" y="532" font-size="12.5" font-weight="600" fill="#111827">图例</text>
  <line x1="40" y1="548" x2="66" y2="548" stroke="#ea580c" stroke-width="1.8"/>
  <text x="74" y="552" font-size="11.5" fill="#4b5563">任务投递</text>
  <line x1="40" y1="568" x2="66" y2="568" stroke="#059669" stroke-width="1.8" stroke-dasharray="5,3"/>
  <text x="74" y="572" font-size="11.5" fill="#4b5563">广播</text>
  <line x1="40" y1="588" x2="66" y2="588" stroke="#6b7280" stroke-width="1.8" stroke-dasharray="5,4"/>
  <text x="74" y="592" font-size="11.5" fill="#4b5563">推送下行</text>
  <text x="600" y="560" text-anchor="middle" font-size="12" fill="#4b5563">worker 与 api 是两个进程：靠 Redis 交接，不共享内存</text>
</svg>