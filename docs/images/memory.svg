<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 760" width="980" height="760" font-family="Segoe UI, Microsoft YaHei, PingFang SC, Noto Sans SC, Helvetica Neue, Arial, sans-serif">
  <rect width="980" height="760" fill="#ffffff"/>
  <defs>
    <marker id="ablue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker>
    <marker id="agreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/></marker>
    <marker id="aorange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ea580c"/></marker>
    <marker id="apurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/></marker>
    <marker id="agray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/></marker>
  </defs>
  <text x="32" y="40" font-size="19" font-weight="600" fill="#111827">两级记忆与两段式检索（RAG）</text>
  <rect x="40" y="76" width="240" height="56" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="160.0" y="98" text-anchor="middle" font-size="14" font-weight="600" fill="#2563eb">玩家这句话</text>
  <text x="160.0" y="118" text-anchor="middle" font-size="12" fill="#4b5563">"我不吃什么来着？"</text>
  <text x="310" y="96" text-anchor="start" font-size="13" fill="#059669">写入路径</text>
  <rect x="310" y="108" width="200" height="56" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="410.0" y="130" text-anchor="middle" font-size="14" font-weight="600" fill="#059669">write_memory</text>
  <text x="410.0" y="150" text-anchor="middle" font-size="12" fill="#4b5563">每轮对话 + 抽取的事实</text>
  <rect x="600" y="92" width="200" height="56" rx="8" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>
  <text x="700.0" y="114" text-anchor="middle" font-size="14" font-weight="600" fill="#111827">Redis List</text>
  <text x="700.0" y="134" text-anchor="middle" font-size="12" fill="#4b5563">最近 5 轮 · TTL 2h</text>
  <rect x="600" y="178" width="200" height="56" rx="8" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>
  <text x="700.0" y="200" text-anchor="middle" font-size="14" font-weight="600" fill="#111827">pgvector memories</text>
  <text x="700.0" y="220" text-anchor="middle" font-size="12" fill="#4b5563">1024 维 · 永久保存</text>
  <line x1="510" y1="130" x2="596" y2="116" stroke="#059669" stroke-width="1.8" stroke-dasharray="5,3" marker-end="url(#agreen)"/>
  <line x1="510" y1="156" x2="596" y2="200" stroke="#059669" stroke-width="1.8" stroke-dasharray="5,3" marker-end="url(#agreen)"/>
  <text x="40" y="276" text-anchor="start" font-size="13" fill="#7c3aed">读取路径</text>
  <rect x="40" y="286" width="150" height="56" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="115.0" y="308" text-anchor="middle" font-size="14" font-weight="600" fill="#7c3aed">embedding</text>
  <text x="115.0" y="328" text-anchor="middle" font-size="12" fill="#4b5563">text-embedding-v3</text>
  <line x1="190" y1="313" x2="234" y2="313" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#apurple)"/>
  <rect x="234" y="286" width="170" height="56" rx="8" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>
  <text x="319.0" y="308" text-anchor="middle" font-size="14" font-weight="600" fill="#111827">SQL 粗排</text>
  <text x="319.0" y="328" text-anchor="middle" font-size="12" fill="#4b5563">ORDER BY &lt;=&gt; LIMIT 20</text>
  <line x1="404" y1="313" x2="440" y2="313" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#apurple)"/>
  <line x1="440" y1="313" x2="440" y2="250" stroke="#7c3aed" stroke-width="1.6"/>
  <line x1="440" y1="250" x2="468" y2="250" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#apurple)"/>
  <line x1="440" y1="313" x2="440" y2="313" stroke="#7c3aed" stroke-width="1.6"/>
  <line x1="440" y1="313" x2="468" y2="313" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#apurple)"/>
  <line x1="440" y1="313" x2="440" y2="376" stroke="#7c3aed" stroke-width="1.6"/>
  <line x1="440" y1="376" x2="468" y2="376" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#apurple)"/>
  <rect x="470" y="228" width="160" height="56" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="550.0" y="250" text-anchor="middle" font-size="13" font-weight="600" fill="#2563eb">relevance</text>
  <text x="550.0" y="270" text-anchor="middle" font-size="12" fill="#4b5563">1 − 余弦距离</text>
  <rect x="470" y="291" width="160" height="56" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="550.0" y="313" text-anchor="middle" font-size="13" font-weight="600" fill="#059669">recency</text>
  <text x="550.0" y="333" text-anchor="middle" font-size="12" fill="#4b5563">0.5 ^ (age / 138h)</text>
  <rect x="470" y="354" width="160" height="56" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="550.0" y="376" text-anchor="middle" font-size="13" font-weight="600" fill="#ea580c">importance</text>
  <text x="550.0" y="396" text-anchor="middle" font-size="12" fill="#4b5563">LLM 打分 0~1</text>
  <line x1="630" y1="264" x2="676" y2="327" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#apurple)"/>
  <line x1="630" y1="327" x2="676" y2="327" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#apurple)"/>
  <line x1="630" y1="390" x2="676" y2="327" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#apurple)"/>
  <rect x="676" y="288" width="150" height="74" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="751.0" y="310" text-anchor="middle" font-size="14" font-weight="600" fill="#7c3aed">三因子重排</text>
  <text x="751.0" y="330" text-anchor="middle" font-size="12" fill="#4b5563">0.85 / 0.05 / 0.10</text>
  <text x="751.0" y="348" text-anchor="middle" font-size="12" fill="#4b5563">取 Top-5</text>
  <line x1="826" y1="327" x2="852" y2="327" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#apurple)"/>
  <rect x="852" y="300" width="100" height="56" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="902.0" y="322" text-anchor="middle" font-size="12" font-weight="600" fill="#2563eb">注入 prompt</text>
  <text x="902.0" y="342" text-anchor="middle" font-size="12" fill="#4b5563">你记得…</text>
  <line x1="751" y1="360" x2="751" y2="408" stroke="#059669" stroke-width="1.8" stroke-dasharray="5,3" marker-end="url(#agreen)"/>
  <text x="751" y="428" text-anchor="middle" font-size="11" fill="#059669">命中后 access_count + 1 / 刷新 last_access_at（复习效应）</text>
  <rect x="40" y="470" width="900" height="74" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="490.0" y="492" text-anchor="middle" font-size="14" font-weight="600" fill="#111827">为什么分两层</text>
  <text x="490.0" y="512" text-anchor="middle" font-size="12" fill="#4b5563">工作记忆管「连贯性」：刚才说了什么 → 按时间取，精确、便宜、可丢</text>
  <text x="490.0" y="530" text-anchor="middle" font-size="12" fill="#4b5563">长期记忆管「人格一致性」：三个月前说过什么 → 按语义取，模糊、持久、不可丢</text>
  <rect x="40" y="574" width="900" height="74" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="490.0" y="596" text-anchor="middle" font-size="14" font-weight="600" fill="#111827">为什么两段式</text>
  <text x="490.0" y="616" text-anchor="middle" font-size="12" fill="#4b5563">数据库擅长按向量距离取前 N（能吃到 ANN 索引）；应用层擅长可解释、可调参、可单测的加权</text>
  <text x="490.0" y="634" text-anchor="middle" font-size="12" fill="#4b5563">全放 SQL → 没法做消融实验；全放 Python → 要把整个记忆池拉进内存</text>
  <text x="40" y="690" font-size="12.5" font-weight="600" fill="#111827">图例</text>
  <line x1="40" y1="706" x2="66" y2="706" stroke="#059669" stroke-width="1.8" stroke-dasharray="5,3"/>
  <text x="74" y="710" font-size="11.5" fill="#4b5563">写 / 强化</text>
  <line x1="40" y1="726" x2="66" y2="726" stroke="#7c3aed" stroke-width="1.8"/>
  <text x="74" y="730" font-size="11.5" fill="#4b5563">检索</text>
</svg>