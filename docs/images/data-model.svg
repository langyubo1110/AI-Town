<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" width="960" height="660" font-family="Segoe UI, Microsoft YaHei, PingFang SC, Noto Sans SC, Helvetica Neue, Arial, sans-serif">
  <rect width="960" height="660" fill="#ffffff"/>
  <defs>
    <marker id="ablue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker>
    <marker id="agreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/></marker>
    <marker id="aorange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ea580c"/></marker>
    <marker id="apurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/></marker>
    <marker id="agray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/></marker>
  </defs>
  <text x="32" y="40" font-size="19" font-weight="600" fill="#111827">数据模型（5 张表）</text>
  <rect x="40" y="250" width="190" height="74" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="135.0" y="272" text-anchor="middle" font-size="14" font-weight="600" fill="#2563eb">players</text>
  <text x="135.0" y="292" text-anchor="middle" font-size="12" fill="#4b5563">id · name</text>
  <text x="135.0" y="310" text-anchor="middle" font-size="12" fill="#4b5563">is_active</text>
  <rect x="730" y="250" width="190" height="74" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="825.0" y="272" text-anchor="middle" font-size="14" font-weight="600" fill="#7c3aed">npcs</text>
  <text x="825.0" y="292" text-anchor="middle" font-size="12" fill="#4b5563">id · name · title</text>
  <text x="825.0" y="310" text-anchor="middle" font-size="12" fill="#4b5563">location · is_active</text>
  <rect x="330" y="110" width="300" height="92" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="480.0" y="132" text-anchor="middle" font-size="14" font-weight="600" fill="#059669">affinities</text>
  <text x="480.0" y="152" text-anchor="middle" font-size="12" fill="#4b5563">player_id (FK) · npc_id (FK)</text>
  <text x="480.0" y="170" text-anchor="middle" font-size="12" fill="#4b5563">score 0~100</text>
  <text x="480.0" y="188" text-anchor="middle" font-size="12" fill="#4b5563">UNIQUE(player_id, npc_id)</text>
  <line x1="230" y1="287.0" x2="326" y2="156.0" stroke="#2563eb" stroke-width="1.8" marker-end="url(#ablue)"/>
  <line x1="730" y1="287.0" x2="634" y2="156.0" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#apurple)"/>
  <text x="296" y="150.0" text-anchor="middle" font-size="10.5" fill="#4b5563">1:n</text>
  <text x="664" y="150.0" text-anchor="middle" font-size="10.5" fill="#4b5563">1:n</text>
  <rect x="330" y="280" width="300" height="92" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="480.0" y="302" text-anchor="middle" font-size="14" font-weight="600" fill="#059669">memories</text>
  <text x="480.0" y="322" text-anchor="middle" font-size="12" fill="#4b5563">player_id + npc_id (FK)</text>
  <text x="480.0" y="340" text-anchor="middle" font-size="12" fill="#4b5563">content · embedding vector(1024)</text>
  <text x="480.0" y="358" text-anchor="middle" font-size="12" fill="#4b5563">importance · access_count</text>
  <line x1="230" y1="287.0" x2="326" y2="326.0" stroke="#2563eb" stroke-width="1.8" marker-end="url(#ablue)"/>
  <line x1="730" y1="287.0" x2="634" y2="326.0" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#apurple)"/>
  <text x="296" y="320.0" text-anchor="middle" font-size="10.5" fill="#4b5563">1:n</text>
  <text x="664" y="320.0" text-anchor="middle" font-size="10.5" fill="#4b5563">1:n</text>
  <rect x="330" y="450" width="300" height="92" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="480.0" y="472" text-anchor="middle" font-size="14" font-weight="600" fill="#ea580c">events</text>
  <text x="480.0" y="492" text-anchor="middle" font-size="12" fill="#4b5563">player_id (FK) · npc_id (FK, 可空)</text>
  <text x="480.0" y="510" text-anchor="middle" font-size="12" fill="#4b5563">type · summary</text>
  <text x="480.0" y="528" text-anchor="middle" font-size="12" fill="#4b5563">payload (JSONB)</text>
  <line x1="230" y1="287.0" x2="326" y2="496.0" stroke="#2563eb" stroke-width="1.8" marker-end="url(#ablue)"/>
  <line x1="730" y1="287.0" x2="634" y2="496.0" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#apurple)"/>
  <text x="296" y="490.0" text-anchor="middle" font-size="10.5" fill="#4b5563">1:n</text>
  <text x="664" y="490.0" text-anchor="middle" font-size="10.5" fill="#4b5563">1:n</text>
  <rect x="40" y="400" width="230" height="110" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="155.0" y="422" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">约束与索引</text>
  <text x="155.0" y="442" text-anchor="middle" font-size="12" fill="#4b5563">UNIQUE(player_id, npc_id)</text>
  <text x="155.0" y="460" text-anchor="middle" font-size="12" fill="#4b5563">CHECK(score BETWEEN 0 AND 100)</text>
  <text x="155.0" y="478" text-anchor="middle" font-size="12" fill="#4b5563">events 索引 (player_id, id)</text>
  <text x="155.0" y="496" text-anchor="middle" font-size="12" fill="#4b5563">memories：暂不建 HNSW</text>
  <rect x="680" y="400" width="240" height="128" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="800.0" y="422" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">设计要点</text>
  <text x="800.0" y="442" text-anchor="middle" font-size="12" fill="#4b5563">ON DELETE CASCADE：删 NPC</text>
  <text x="800.0" y="460" text-anchor="middle" font-size="12" fill="#4b5563">  连带删记忆 / 好感度 / 事件</text>
  <text x="800.0" y="478" text-anchor="middle" font-size="12" fill="#4b5563">affinities 是关系表，</text>
  <text x="800.0" y="496" text-anchor="middle" font-size="12" fill="#4b5563">  不是玩家表上的 JSON</text>
  <text x="800.0" y="514" text-anchor="middle" font-size="12" fill="#4b5563">events 只增不改（台账）</text>
  <text x="480" y="610" text-anchor="middle" font-size="11.5" fill="#4b5563">两个父表各自连三张子表；子表都是「谁和谁」的复合键，所以隔离查询永远带双维度</text>
</svg>