<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 640" width="940" height="640" font-family="Segoe UI, Microsoft YaHei, PingFang SC, Noto Sans SC, Helvetica Neue, Arial, sans-serif">
  <rect width="940" height="640" fill="#ffffff"/>
  <defs>
    <marker id="ablue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker>
    <marker id="agreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/></marker>
    <marker id="aorange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ea580c"/></marker>
    <marker id="apurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/></marker>
    <marker id="agray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/></marker>
  </defs>
  <text x="32" y="40" font-size="19" font-weight="600" fill="#111827">WebSocket 连接的生命周期</text>
  <rect x="60" y="64" width="160" height="38" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="140.0" y="86" text-anchor="middle" font-size="13" font-weight="600" fill="#2563eb">浏览器</text>
  <line x1="140" y1="116" x2="140" y2="546" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="6,5"/>
  <rect x="260" y="64" width="160" height="38" rx="8" fill="#ffffff" stroke="#059669" stroke-width="1.5"/>
  <text x="340.0" y="86" text-anchor="middle" font-size="13" font-weight="600" fill="#059669">ws.py（api）</text>
  <line x1="340" y1="116" x2="340" y2="546" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="6,5"/>
  <rect x="480" y="64" width="160" height="38" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="560.0" y="86" text-anchor="middle" font-size="13" font-weight="600" fill="#6b7280">Redis Pub/Sub</text>
  <line x1="560" y1="116" x2="560" y2="546" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="6,5"/>
  <rect x="710" y="64" width="160" height="38" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="790.0" y="86" text-anchor="middle" font-size="13" font-weight="600" fill="#7c3aed">worker</text>
  <line x1="790" y1="116" x2="790" y2="546" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="6,5"/>
  <line x1="140" y1="156" x2="340" y2="156" stroke="#2563eb" stroke-width="1.8" marker-end="url(#ablue)"/>
  <text x="240.0" y="147" text-anchor="middle" font-size="11" fill="#4b5563">WS 握手 /ws/events?player_id=6</text>
  <line x1="340" y1="196" x2="560" y2="196" stroke="#059669" stroke-width="1.8" marker-end="url(#agreen)"/>
  <text x="450.0" y="187" text-anchor="middle" font-size="11" fill="#4b5563">SUBSCRIBE aitown:events:player:6</text>
  <rect x="336" y="222" width="8" height="30" fill="#059669" opacity="0.85"/>
  <text x="356" y="240" font-size="11.5" fill="#4b5563">accept() + 启动 _pump / _watch</text>
  <line x1="790" y1="286" x2="560" y2="286" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#apurple)"/>
  <text x="675.0" y="277" text-anchor="middle" font-size="11" fill="#4b5563">PUBLISH {张三去会议室…}</text>
  <line x1="560" y1="326" x2="340" y2="326" stroke="#6b7280" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#agray)"/>
  <text x="450.0" y="317" text-anchor="middle" font-size="11" fill="#4b5563">消息到达 pubsub.listen()</text>
  <line x1="340" y1="366" x2="140" y2="366" stroke="#2563eb" stroke-width="1.8" marker-end="url(#ablue)"/>
  <text x="240.0" y="357" text-anchor="middle" font-size="11" fill="#4b5563">send_text(JSON)</text>
  <line x1="560" y1="406" x2="340" y2="406" stroke="#6b7280" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#agray)"/>
  <text x="450.0" y="397" text-anchor="middle" font-size="11" fill="#4b5563">第二条消息到达</text>
  <line x1="340" y1="446" x2="140" y2="446" stroke="#2563eb" stroke-width="1.8" marker-end="url(#ablue)"/>
  <text x="240.0" y="437" text-anchor="middle" font-size="11" fill="#4b5563">send_text(JSON)</text>
  <line x1="140" y1="486" x2="340" y2="486" stroke="#ea580c" stroke-width="1.8" marker-end="url(#aorange)"/>
  <text x="240.0" y="477" text-anchor="middle" font-size="11" fill="#4b5563">关闭页面</text>
  <line x1="340" y1="526" x2="560" y2="526" stroke="#059669" stroke-width="1.8" marker-end="url(#agreen)"/>
  <text x="450.0" y="517" text-anchor="middle" font-size="11" fill="#4b5563">UNSUBSCRIBE + aclose</text>
  <rect x="40" y="556" width="860" height="74" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="470.0" y="578" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">断线处理</text>
  <text x="470.0" y="598" text-anchor="middle" font-size="12" fill="#4b5563">两任务任一结束 → asyncio.wait(FIRST_COMPLETED) → finally：cancel + await + unsubscribe + aclose</text>
  <text x="470.0" y="616" text-anchor="middle" font-size="12" fill="#4b5563">前端：指数退避重连（1s→2s→…→30s，带抖动），断线期间靠轮询 GET /api/events 补齐</text>
</svg>