<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 700" width="980" height="700" font-family="Segoe UI, Microsoft YaHei, PingFang SC, Noto Sans SC, Helvetica Neue, Arial, sans-serif">
  <rect width="980" height="700" fill="#ffffff"/>
  <defs>
    <marker id="ablue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker>
    <marker id="agreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/></marker>
    <marker id="aorange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ea580c"/></marker>
    <marker id="apurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/></marker>
    <marker id="agray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/></marker>
  </defs>
  <text x="32" y="40" font-size="19" font-weight="600" fill="#111827">AI Town 部署架构</text>
  <rect x="24" y="58" width="932" height="600" rx="10" fill="none" stroke="#d1d5db" stroke-dasharray="6,4"/>
  <rect x="390" y="76" width="200" height="74" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="490.0" y="98" text-anchor="middle" font-size="14" font-weight="600" fill="#2563eb">浏览器</text>
  <text x="490.0" y="118" text-anchor="middle" font-size="12" fill="#4b5563">Vue 3 + PixiJS 8</text>
  <text x="490.0" y="136" text-anchor="middle" font-size="12" fill="#4b5563">WASD 移动 / 按 E 对话</text>
  <line x1="490" y1="150" x2="490" y2="172" stroke="#2563eb" stroke-width="1.8" marker-end="url(#ablue)"/>
  <text x="500" y="160" text-anchor="start" font-size="11" fill="#4b5563">HTTP 8080 / WS</text>
  <rect x="340" y="174" width="300" height="92" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="490.0" y="196" text-anchor="middle" font-size="14" font-weight="600" fill="#ea580c">web 容器 · Nginx</text>
  <text x="490.0" y="216" text-anchor="middle" font-size="12" fill="#4b5563">/ → 静态 dist</text>
  <text x="490.0" y="234" text-anchor="middle" font-size="12" fill="#4b5563">/api → api:8000</text>
  <text x="490.0" y="252" text-anchor="middle" font-size="12" fill="#4b5563">/ws → api:8000（含 Upgrade 头）</text>
  <line x1="440" y1="266" x2="350" y2="296" stroke="#2563eb" stroke-width="1.8" marker-end="url(#ablue)"/>
  <line x1="540" y1="266" x2="640" y2="296" stroke="#6b7280" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#agray)"/>
  <rect x="190" y="300" width="320" height="92" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="350.0" y="322" text-anchor="middle" font-size="14" font-weight="600" fill="#059669">api 容器 · FastAPI</text>
  <text x="350.0" y="342" text-anchor="middle" font-size="12" fill="#4b5563">POST /api/chat → LangGraph</text>
  <text x="350.0" y="360" text-anchor="middle" font-size="12" fill="#4b5563">GET /api/events · WS /ws/events</text>
  <text x="350.0" y="378" text-anchor="middle" font-size="12" fill="#4b5563">GET /api/town/plans</text>
  <rect x="560" y="300" width="300" height="92" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="710.0" y="322" text-anchor="middle" font-size="14" font-weight="600" fill="#7c3aed">worker 容器</text>
  <text x="710.0" y="342" text-anchor="middle" font-size="12" fill="#4b5563">consumer：XREADGROUP 消费任务</text>
  <text x="710.0" y="360" text-anchor="middle" font-size="12" fill="#4b5563">ticker：每 60s 推进日计划</text>
  <text x="710.0" y="378" text-anchor="middle" font-size="12" fill="#4b5563">与 api 同镜像，只是 command 不同</text>
  <line x1="250" y1="392" x2="250" y2="424" stroke="#059669" stroke-width="1.8" marker-end="url(#agreen)"/>
  <line x1="420" y1="392" x2="470" y2="424" stroke="#059669" stroke-width="1.8" marker-end="url(#agreen)"/>
  <line x1="700" y1="392" x2="600" y2="424" stroke="#059669" stroke-width="1.8" marker-end="url(#agreen)"/>
  <line x1="790" y1="392" x2="790" y2="424" stroke="#059669" stroke-width="1.8" marker-end="url(#agreen)"/>
  <rect x="150" y="428" width="300" height="74" rx="8" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>
  <text x="300.0" y="450" text-anchor="middle" font-size="14" font-weight="600" fill="#111827">postgres + pgvector</text>
  <text x="300.0" y="470" text-anchor="middle" font-size="12" fill="#4b5563">players / npcs / affinities</text>
  <text x="300.0" y="488" text-anchor="middle" font-size="12" fill="#4b5563">memories（1024 维）/ events</text>
  <rect x="520" y="428" width="300" height="92" rx="8" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>
  <text x="670.0" y="450" text-anchor="middle" font-size="14" font-weight="600" fill="#111827">redis</text>
  <text x="670.0" y="470" text-anchor="middle" font-size="12" fill="#4b5563">List：工作记忆 5 轮 / 2h</text>
  <text x="670.0" y="488" text-anchor="middle" font-size="12" fill="#4b5563">Stream：任务队列 + ACK</text>
  <text x="670.0" y="506" text-anchor="middle" font-size="12" fill="#4b5563">Pub/Sub：实时推送</text>
  <text x="500" y="536" text-anchor="middle" font-size="12" fill="#4b5563">api 与 worker 共用一份代码与镜像；两者只通过 Redis（Stream / Pub/Sub）和数据库交接</text>
  <text x="40" y="548" font-size="12.5" font-weight="600" fill="#111827">图例</text>
  <line x1="40" y1="564" x2="66" y2="564" stroke="#2563eb" stroke-width="1.8"/>
  <text x="74" y="568" font-size="11.5" fill="#4b5563">请求</text>
  <line x1="40" y1="584" x2="66" y2="584" stroke="#059669" stroke-width="1.8"/>
  <text x="74" y="588" font-size="11.5" fill="#4b5563">数据读写</text>
  <line x1="40" y1="604" x2="66" y2="604" stroke="#6b7280" stroke-width="1.8" stroke-dasharray="5,4"/>
  <text x="74" y="608" font-size="11.5" fill="#4b5563">异步 / 推送</text>
</svg>