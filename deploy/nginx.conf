server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # ---------- 前端静态资源 ----------
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # ---------- 健康检查 ----------
    # 必须显式反代：/health 不在 /api/ 下，不写这条会落到下面的
    # try_files → 返回 index.html 且状态码 200，探针会误判"服务正常"
    location = /health {
        proxy_pass http://api:8000/health;
        proxy_set_header Host $host;
        access_log off;
    }

    # ---------- REST API ----------
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 一轮对话 3~5 秒；NPC 多轮对话更久，给足余量
        proxy_read_timeout 180s;
    }

    # ---------- SSE 流式对话 ----------
    # 精确匹配优先级高于 /api/ 前缀，所以这一条会覆盖默认的 API 反代。
    # 关键是 proxy_buffering off：nginx 默认会把上游响应攒满一个 buffer 再发，
    # 那样"流式"就退化成"等 3 秒一次性吐完"，前端看不到逐字效果。
    location = /api/chat/stream {
        proxy_pass http://api:8000;
        proxy_buffering off;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 180s;
    }

    # ---------- WebSocket ----------
    # 这三行是 WebSocket 反代的固定套路，缺一不可：
    #   proxy_http_version 1.1   Nginx 默认 HTTP/1.0，协议升级请求会被丢
    #   Upgrade $http_upgrade     透传客户端的 Upgrade: websocket
    #   Connection "upgrade"      告诉后端这条连接要升级
    location /ws/ {
        proxy_pass http://api:8000;

        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;

        # WS 是长连接，默认 60 秒空闲会被 Nginx 掐断
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}